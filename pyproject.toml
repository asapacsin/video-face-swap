[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face-replace"
version = "0.1.0"
description = "Consent-gated local media preflight for a FaceFusion GPU pipeline"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.2"]

[project.scripts]
face-replace = "face_replace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
